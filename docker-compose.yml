services:
  chrome:
    user: "0:0"
    image: zenika/alpine-chrome:latest
    command:
      - --headless=new
      - --no-sandbox
      - --remote-debugging-address=0.0.0.0
      - --remote-debugging-port=9222
      - --remote-allow-origins=*
      - --user-data-dir=/data
      - --no-first-run
    volumes:
      - chrome-profile:/data
    restart: unless-stopped

  gateway:
    build: .
    environment:
      WEB2MODEL_CDP_URL: http://chrome:9222
    ports:
      - "8789:8788"
    depends_on:
      - chrome
    restart: unless-stopped

volumes:
  chrome-profile:
