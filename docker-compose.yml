services:
  chrome:
    image: zenika/alpine-chrome:latest
    user: "0:0"
    command:
      - --headless=new
      - --no-sandbox
      - --remote-debugging-address=0.0.0.0
      - --remote-debugging-port=9222
      - --remote-allow-origins=*
      - --user-data-dir=/data
      - --no-first-run
    volumes:
      - chrome-profile:/data
    restart: unless-stopped

  chrome-proxy:
    image: nginx:alpine
    network_mode: "service:chrome"
    volumes:
      - ./docker/nginx-cdp.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      - chrome
    restart: unless-stopped

  gateway:
    build: .
    environment:
      WEB2MODEL_CDP_URL: http://chrome:9223
      WEB2MODEL_GATEWAY_HOST: 0.0.0.0
    ports:
      - "8789:8788"
    depends_on:
      - chrome
      - chrome-proxy
    restart: unless-stopped

volumes:
  chrome-profile:
